<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — EventHub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; flex-direction: column; }
    .auth-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .auth-card { width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 40px 36px; }
    .auth-logo { text-align: center; margin-bottom: 24px; }
    .auth-logo a { font-family: var(--font-head); font-size: 24px; font-weight: 800; background: linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
    .auth-title { font-family: var(--font-head); font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .auth-sub { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 28px; }
    .auth-sub a { color: var(--accent); text-decoration: none; }
    .success-msg { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3); border-radius: 10px; padding: 14px; text-align: center; font-size: 14px; color: var(--success); display: none; margin-bottom: 16px; }
    .bottom-link { text-align: center; font-size: 13px; color: var(--muted); margin-top: 20px; }
    .bottom-link a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
<div class="glow-tl"></div><div class="glow-br"></div>
<nav>
  <a href="index.html" class="nav-logo">EventHub</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="events.html">Events</a>
    <a href="login.html">Login</a>
    <a href="register.html" class="nav-cta active">Register</a>
  </div>
</nav>
<div class="auth-wrap fade-up">
  <div class="auth-card">
    <div class="auth-logo"><a href="index.html">EventHub</a></div>
    <div class="auth-title">Create account</div>
    <div class="auth-sub">Already have one? <a href="login.html">Sign in</a></div>
    <div class="success-msg" id="successMsg">🎉 Account created! Redirecting...</div>
    <div class="row2">
      <div class="field"><label>First name</label><input type="text" id="firstName" placeholder="John"><div class="err-msg" id="err-firstName">Required</div></div>
      <div class="field"><label>Last name</label><input type="text" id="lastName" placeholder="Doe"><div class="err-msg" id="err-lastName">Required</div></div>
    </div>
    <div class="field"><label>Email</label><input type="email" id="email" placeholder="you@email.com"><div class="err-msg" id="err-email">Valid email required</div></div>
    <div class="field"><label>Phone</label><input type="tel" id="phone" placeholder="+91 98765 43210"><div class="err-msg" id="err-phone">Required</div></div>
    <div class="field"><label>Password</label><input type="password" id="password" placeholder="Min. 6 characters"><div class="err-msg" id="err-password">Min 6 characters</div></div>
    <div class="field"><label>Confirm password</label><input type="password" id="confirm" placeholder="Repeat password"><div class="err-msg" id="err-confirm">Passwords don't match</div></div>
    <button class="btn btn-block" style="margin-top:4px;" onclick="doRegister()">Create Account →</button>
    <div class="bottom-link">Already registered? <a href="login.html">Sign in</a></div>
  </div>
</div>
<footer>
  <div>© 2026 EventHub.</div>
  <div style="display:flex;gap:24px;"><a href="index.html">Home</a><a href="events.html">Events</a></div>
</footer>
<script>
  function showErr(id,show){ document.getElementById('err-'+id).classList.toggle('show',show); document.getElementById(id).classList.toggle('err',show); }
  function doRegister(){
    const fn=document.getElementById('firstName').value.trim();
    const ln=document.getElementById('lastName').value.trim();
    const em=document.getElementById('email').value.trim();
    const ph=document.getElementById('phone').value.trim();
    const pw=document.getElementById('password').value;
    const cf=document.getElementById('confirm').value;
    const emailOk=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em);
    showErr('firstName',!fn); showErr('lastName',!ln); showErr('email',!emailOk);
    showErr('phone',!ph); showErr('password',pw.length<6); showErr('confirm',pw!==cf);
    if(!fn||!ln||!emailOk||!ph||pw.length<6||pw!==cf) return;
    localStorage.setItem('loggedIn','true');
    localStorage.setItem('userName',fn+' '+ln);
    localStorage.setItem('userEmail',em);
    document.getElementById('successMsg').style.display='block';
    setTimeout(()=>window.location.href='dashboard.html',1500);
  }
</script>
</body>
</html>
