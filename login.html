<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — EventHub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; flex-direction: column; }
    .auth-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .auth-card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 40px 36px; }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo a { font-family: var(--font-head); font-size: 24px; font-weight: 800; background: linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
    .auth-title { font-family: var(--font-head); font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .auth-sub { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 28px; }
    .auth-sub a { color: var(--accent); text-decoration: none; }
    .forgot { display: block; text-align: right; font-size: 12px; color: var(--accent); text-decoration: none; margin-top: -8px; margin-bottom: 16px; }
    .divider-or { display: flex; align-items: center; gap: 12px; margin: 20px 0; font-size: 12px; color: var(--muted); }
    .divider-or::before, .divider-or::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .social-btn { width: 100%; padding: 11px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: var(--font-body); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; transition: background 0.2s; text-decoration: none; }
    .social-btn:hover { background: var(--card2); }
    .bottom-link { text-align: center; font-size: 13px; color: var(--muted); margin-top: 20px; }
    .bottom-link a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
<div class="glow-tl"></div><div class="glow-br"></div>
<nav>
  <a href="index.html" class="nav-logo">EventHub</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="events.html">Events</a>
    <a href="login.html" class="active">Login</a>
    <a href="register.html" class="nav-cta">Register</a>
  </div>
</nav>
<div class="auth-wrap fade-up">
  <div class="auth-card">
    <div class="auth-logo"><a href="index.html">EventHub</a></div>
    <div class="auth-title">Welcome back</div>
    <div class="auth-sub">Don't have an account? <a href="register.html">Sign up free</a></div>
    <a href="#" class="social-btn">🌐 Continue with Google</a>
    <div class="divider-or">or sign in with email</div>
    <div class="field"><label for="email">Email address</label><input type="email" id="email" placeholder="you@email.com"></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" placeholder="••••••••"></div>
    <a href="#" class="forgot">Forgot password?</a>
    <button class="btn btn-block" onclick="doLogin()">Sign In →</button>
    <div class="bottom-link">New here? <a href="register.html">Create an account</a></div>
  </div>
</div>
<footer>
  <div>© 2026 EventHub.</div>
  <div style="display:flex;gap:24px;"><a href="index.html">Home</a><a href="events.html">Events</a></div>
</footer>
<script>
  function doLogin(){
    const e=document.getElementById('email').value.trim();
    const p=document.getElementById('password').value;
    if(!e||!p){ alert('Please fill in all fields.'); return; }
    localStorage.setItem('loggedIn','true');
    localStorage.setItem('userEmail',e);
    window.location.href='dashboard.html';
  }
</script>
</body>
</html>
